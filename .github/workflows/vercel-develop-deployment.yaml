name: Vercel Develop Branch Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - develop
jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install npm packages
        run: yarn
      - name: Static code analysis
        run: yarn lint
      - name: Unit test
        run: yarn test
      - name: Library build
        run: yarn lib-build
      # Fails if Sentry / PWA / external CDN URLs leaked into the package
      # (integration spec acceptance criterion 3).
      - name: Library bundle check
        run: yarn lib-check
      - name: Build example host app
        run: npm ci && npm run build
        working-directory: examples/host-app
      - name: Build example vanilla host
        run: npm ci && npm run build
        working-directory: examples/vanilla-host
  Deploy-Develop:
    runs-on: ubuntu-latest
    needs: [UnitTest]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_APP_GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Deploy Project Artifacts to Vercel
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2.1.0
        env:
          SLACK_WEBHOOK: ${{ secrets.DIGITIZER_DEV_SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: |
            Develop branch deployed!
            Preview URL: ${{ env.DEPLOY_URL }}
