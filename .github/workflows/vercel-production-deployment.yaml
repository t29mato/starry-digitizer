name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: install npm packages
        run: yarn install
      - name: Static code analysis
        run: yarn lint
      - name: Unit test
        run: yarn test
      - name: Library build
        run: yarn lib-build
      # Fails if Sentry / PWA / external CDN URLs leaked into the package
      # (integration spec acceptance criterion 3).
      - name: Library bundle check
        run: yarn lib-check
      - name: Build example host app
        run: npm ci && npm run build
        working-directory: examples/host-app
      - name: Build example vanilla host
        run: npm ci && npm run build
        working-directory: examples/vanilla-host
  E2E-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: install npm packages
        run: yarn install
      - name: Cypress run
        uses: cypress-io/github-action@v4
        with:
          start: yarn dev
          wait-on: 'http://localhost:8888'
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Deploy-Production-on-Vercel:
    runs-on: ubuntu-latest
    needs: [UnitTest, E2E-Test]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Verify Version Match
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          
          # Get version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          # Check if versions match
          if [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "✅ Version check passed: $TAG_VERSION"
          else
              echo "❌ Version mismatch!"
              echo "   Tag version: $TAG_VERSION"
              echo "   Package.json version: $PACKAGE_VERSION"
              exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
  # INFO: The library is NOT published to npm. Hosts (Starrydata3) install
  # the tarball attached to the GitHub Release of the tag instead:
  #   "starry-digitizer": "https://github.com/t29mato/starry-digitizer/releases/download/v<ver>/starry-digitizer-<ver>.tgz"
  # See docs/embedding.rst and the Starrydata3 integration guide.
  Release-Package-Tarball:
    runs-on: ubuntu-latest
    needs: [UnitTest, E2E-Test]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: install npm packages
        run: yarn install
      - name: Verify Version Match
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "Version check passed: $TAG_VERSION"
          else
              echo "Version mismatch: tag=$TAG_VERSION package.json=$PACKAGE_VERSION"
              exit 1
          fi
      # INFO: library-build/dist is gitignored, so the package contents must
      # be built here — otherwise `files` would pack an empty directory.
      - name: Library build
        run: yarn lib-build
      - name: Library bundle check
        run: yarn lib-check
      - name: Pack tarball
        run: |
          npm pack
          ls -l starry-digitizer-*.tgz
      - name: Attach tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" starry-digitizer-*.tgz --clobber
  Notify-Slack:
    runs-on: ubuntu-latest
    needs: [Deploy-Production-on-Vercel, Release-Package-Tarball]
    steps:
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2.1.0
        env:
          SLACK_WEBHOOK: ${{ secrets.DIGITIZER_DEV_SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
