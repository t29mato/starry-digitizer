name: Vercel Preview Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  pull_request:
    branches:
      - '**'
jobs:
  UnitTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install npm packages
        run: yarn
      - name: Static code analysis
        run: yarn lint
      - name: Unit test
        run: yarn test
      - name: Library build
        run: yarn lib-build
      # Fails if Sentry / PWA / external CDN URLs leaked into the package
      # (integration spec acceptance criterion 3).
      - name: Library bundle check
        run: yarn lib-check
      - name: Build example host app
        run: npm ci && npm run build
        working-directory: examples/host-app
      - name: Build example vanilla host
        run: npm ci && npm run build
        working-directory: examples/vanilla-host
      - name: coverage
        run: yarn test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.2.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # INFO: runs on every PR. It has no `needs` and nothing needs it, so it is off
  # the critical path — Deploy-Preview waits for UnitTest only, and the preview
  # arrives at the same time whether this job runs or not. It used to be gated
  # on `github.base_ref == 'main'` (issue #211).
  E2E-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: install npm packages
        run: yarn install
      # INFO: no `record` / `parallel`. Those upload to Cypress Cloud, whose free
      # tier is metered; running the suite inside the runner is not, because
      # Actions minutes are unlimited for public repositories. Parallelism
      # requires recording, and 26 specs on one runner is fast enough.
      # Failures are diagnosed from the artifacts below instead of a dashboard.
      - name: Cypress run
        uses: cypress-io/github-action@v4
        with:
          start: yarn dev
          wait-on: 'http://localhost:8888'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
  Deploy-Preview:
    runs-on: ubuntu-latest
    needs: [UnitTest]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2.1.0
        env:
          SLACK_WEBHOOK: ${{ secrets.DIGITIZER_DEV_SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: |
            Preview URL: ${{ env.DEPLOY_URL }}
