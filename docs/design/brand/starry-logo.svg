<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A3F"/>
      <stop offset="1" stop-color="#070C22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD76A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD76A" stop-opacity="0"/>
    </radialGradient>
    <!-- 4-ray star -->
    <path id="star" d="M 0 -1 C 0.12 -0.12 0.12 -0.12 1 0 C 0.12 0.12 0.12 0.12 0 1 C -0.12 0.12 -0.12 0.12 -1 0 C -0.12 -0.12 -0.12 -0.12 0 -1 Z"/>
  </defs>

  <!-- night sky badge -->
  <rect width="512" height="512" rx="112" fill="url(#night)"/>

  <!-- faint background stars -->
  <g fill="#FFFFFF">
    <circle cx="150" cy="105" r="3" opacity="0.5"/>
    <circle cx="330" cy="80" r="2.5" opacity="0.4"/>
    <circle cx="425" cy="180" r="3" opacity="0.45"/>
    <circle cx="120" cy="210" r="2" opacity="0.35"/>
    <circle cx="250" cy="150" r="2" opacity="0.3"/>
    <circle cx="390" cy="300" r="2" opacity="0.3"/>
  </g>

  <!-- chart axes (the "digitizer" frame) -->
  <g stroke="#E8EEF9" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 112 96 L 112 416 L 432 416"/>
  </g>
  <!-- axis ticks -->
  <g stroke="#E8EEF9" stroke-width="10" stroke-linecap="round" opacity="0.75">
    <line x1="112" y1="340" x2="92" y2="340"/>
    <line x1="112" y1="250" x2="92" y2="250"/>
    <line x1="112" y1="160" x2="92" y2="160"/>
    <line x1="190" y1="416" x2="190" y2="436"/>
    <line x1="280" y1="416" x2="280" y2="436"/>
    <line x1="370" y1="416" x2="370" y2="436"/>
  </g>

  <!-- constellation line: data points connected, rising -->
  <polyline points="160,368 225,300 285,318 345,212 405,150"
            fill="none" stroke="#7FB4FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- data stars on the curve -->
  <circle cx="345" cy="212" r="46" fill="url(#glow)"/>
  <g fill="#FFD76A">
    <use href="#star" transform="translate(160 368) scale(22)"/>
    <use href="#star" transform="translate(225 300) scale(26)"/>
    <use href="#star" transform="translate(285 318) scale(20)"/>
    <use href="#star" transform="translate(345 212) scale(34)"/>
  </g>
  <!-- the brightest star: the point being captured now -->
  <g fill="#FFFFFF">
    <use href="#star" transform="translate(405 150) scale(44)"/>
  </g>
  <circle cx="405" cy="150" r="62" fill="url(#glow)" opacity="0.8"/>
</svg>
