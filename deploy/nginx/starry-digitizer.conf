# nginx locations for <site>/sd/ (docs/design/starryai-auto.md §4).
# A template: `deploy/deploy.sh render <dir>` fills in the web dirs of
# site.env. The result is INCLUDED inside wpd-auto's
# server block (wpd-auto deploy/nginx/wpd-auto.conf, the :80 default_server),
# so the page and the wpd-auto API (/wpd-auto/api/) share one origin: no CORS.
#   sudo install -m 644 <dir>/nginx/starry-digitizer.conf /etc/nginx/snippets/starry-digitizer.conf
#   and in wpd-auto's server block:  include /etc/nginx/snippets/starry-digitizer.conf;
# Static files only; the API is wpd-auto's locations, untouched.

location = /sd { return 301 /sd/; }

location /sd/ {
    alias @WEB_DIR@/www/;
    index index.html;
    # file names under assets/ carry a hash; the rest (index.html,
    # VERSION.txt, version.json) must show a redeploy at once
    expires -1;
}

location /sd/assets/ {
    alias @WEB_DIR@/www/assets/;
    expires 30d;
}

# ---- staging: the same with its directory ----

location = /sd-staging { return 301 /sd-staging/; }

location /sd-staging/ {
    alias @STAGING_WEB_DIR@/www/;
    index index.html;
    expires -1;
}

location /sd-staging/assets/ {
    alias @STAGING_WEB_DIR@/www/assets/;
    expires 30d;
}
